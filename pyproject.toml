[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phono3py-cupy-accelerator"
version = "0.1.0"
authors = [{name = "yangdewei", email = "1147398767@qq.com"}]
description = "Experimental FP64 NumPy/CuPy three-phonon Fourier and contraction kernels"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
phono3py = ["phono3py==3.31.1", "phonopy>=3.5,<3.6"]
cuda12 = ["cupy-cuda12x>=13,<15"]
dev = ["pytest>=8,<10", "build>=1,<2", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: opt-in CUDA tests requiring ACCELERATOR_TEST_GPU=1", "integration: native Phono3py C comparison"]
